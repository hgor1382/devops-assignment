services:
  nginx:
    image: nginx:1.28
    container_name: nginx-task
    restart: unless-stopped

    ports:
      - "8091:8090"
      - "8009:8008"

    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
